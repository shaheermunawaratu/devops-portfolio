
name: Portfolio CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-quality:
    name: Test and Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Trivy filesystem vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"


      - name: Run Ruff static analysis
        run: ruff check .

      - name: Run automated tests
        run: python -m pytest -v
        
      - name: Build Docker image
        run: docker build -t shaheer-devops-portfolio:${{ github.sha }} .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: shaheer-devops-portfolio:${{ github.sha }}
          scan-type: image
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Verify Snyk authentication
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          npx snyk@latest --version
          npx snyk@latest auth "$SNYK_TOKEN"
          echo "Snyk authentication successful"

      - name: Snyk dependency vulnerability scan
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: npx snyk@latest test --file=requirements.txt

      - name: Snyk infrastructure configuration scan
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: npx snyk@latest iac test .

      - name: Snyk Docker image vulnerability scan
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: npx snyk@latest container test shaheer-devops-portfolio:${{ github.sha }} --file=Dockerfile